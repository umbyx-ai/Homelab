services:
  minecraft:
    image: itzg/minecraft-server:2026.11.0-java25
    container_name: minecraft
    restart: always
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: "FABRIC"
      VERSION: "26.2"
      INIT_MEMORY: "2G"
      MAX_MEMORY: "4G"
      TZ: "Europe/Madrid"
    volumes:
      - ./data:/data
    tty: true
    stdin_open: true
