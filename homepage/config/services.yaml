        icon: portainer.png
        href: http://portainer.umbyx
        description: "Docker Container Manager"
        container: portainer
    - Nginx Proxy Manager:
        icon: nginx-proxy-manager.png
        href: http://npm.umbyx
        description: "Reverse Proxy & SSL"
        container: npm

- Network & Security:
     - Pi-hole:
        icon: pi-hole.png
        href: http://pihole.umbyx/admin
        description: "Ad-Blocker & Local DNS"
        container: pihole

- Monitoring:
     - Uptime Kuma:
        icon: uptime-kuma.png
